<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="500" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionEnvelope - one HTTP contract, projected from Result&lt;T&gt;</text>
  <text class="subtitle" x="40" y="78">Your service returns OrionResult's Result&lt;T&gt;; EnvelopeMapper turns it into the one success shape or the one failure shape.</text>

  <!-- the app -->
  <rect class="ext" x="40" y="150" width="230" height="90" rx="14"/>
  <text class="label" x="155" y="182" text-anchor="middle">Your service</text>
  <text class="code" x="155" y="206" text-anchor="middle">Result&lt;T&gt;</text>
  <text class="small" x="155" y="226" text-anchor="middle">OrionResult 0.9.x</text>

  <path class="flow" d="M270,195 L328,195"/>

  <!-- the mapper -->
  <rect class="step" x="330" y="110" width="310" height="170" rx="14"/>
  <text class="label" x="485" y="142" text-anchor="middle">EnvelopeMapper</text>
  <text class="code" x="485" y="172" text-anchor="middle">result.ToEnvelope(meta)</text>
  <text class="code" x="485" y="198" text-anchor="middle">result.ToProblemDetails(traceId)</text>
  <text class="code" x="485" y="224" text-anchor="middle">error.ToProblemDetails(traceId)</text>
  <text class="code" x="485" y="250" text-anchor="middle">StatusFor(ErrorKind)</text>

  <!-- success shape -->
  <path class="flow" d="M640,145 L698,145"/>
  <text class="edge" x="669" y="135" text-anchor="middle">success</text>
  <rect class="ok" x="700" y="110" width="260" height="70" rx="14"/>
  <text class="label" x="830" y="140" text-anchor="middle">Envelope&lt;T&gt;</text>
  <text class="code" x="830" y="162" text-anchor="middle">{ data, meta }</text>

  <!-- failure shape -->
  <path class="flow alt" d="M640,245 L698,245"/>
  <text class="edge" x="669" y="235" text-anchor="middle">failure</text>
  <rect class="fail" x="700" y="210" width="260" height="70" rx="14"/>
  <text class="label" x="830" y="240" text-anchor="middle">ProblemDetails</text>
  <text class="small" x="830" y="262" text-anchor="middle">RFC 9457 problem+json</text>

  <!-- to serialization -->
  <path class="flow" d="M960,145 L1100,145 L1100,338"/>
  <path class="flow" d="M960,245 L1040,245 L1040,338"/>

  <!-- serialization -->
  <rect class="ext" x="640" y="340" width="520" height="120" rx="14"/>
  <text class="label" x="660" y="370">System.Text.Json source generation (no reflection)</text>
  <text class="code" x="660" y="396">OrionEnvelopeJsonContext</text>
  <text class="small" x="860" y="396">Meta, PageMeta, ProblemDetails, ProblemFieldError</text>
  <text class="code" x="660" y="420">your context</text>
  <text class="small" x="760" y="420">[JsonSerializable(typeof(Envelope&lt;OrderDto&gt;))]</text>
  <text class="small" x="660" y="444">camelCase, null members omitted, NativeAOT- and trim-clean</text>

  <!-- DI note -->
  <rect class="note" x="40" y="340" width="560" height="120" rx="10"/>
  <text class="code" x="60" y="370" style="font-variant-ligatures: none">services.AddOrionEnvelope(o =&gt; ...)</text>
  <text class="small" x="60" y="396">registers EnvelopeOptions: WrapSuccessResponses, ProblemDetailsForErrors,</text>
  <text class="small" x="60" y="416">IncludeTraceId (all default true).</text>
  <text class="small" x="60" y="440">Wave 1: nothing reads them yet; you call the projection at the boundary.</text>
</svg>
